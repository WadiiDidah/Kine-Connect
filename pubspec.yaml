name: kine
description: Application Flutter de suivi kinésithérapeute et patient avec rendez-vous, SQLite, Firebase et API REST.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0

  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  pinput: ^5.0.1

  google_fonts: ^6.3.0
  quickalert: ^1.1.0

  table_calendar: ^3.2.0
  fl_chart: ^1.0.0

  intl: ^0.20.2

  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Logo.png
    - assets/tst.jpg
    - assets/officiel.png
    - assets/icon.png